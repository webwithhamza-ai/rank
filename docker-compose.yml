services:
  postgres:
    image: postgres:16-alpine
    container_name: paytorank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: paytorank
    ports:
      - '5432:5432'
    volumes:
      - paytorank-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d paytorank']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  paytorank-pgdata:
